<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Interactive Comments – Active State Perfect</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
  <div id="commentsRoot"></div>
  <div class="input-card" id="newMainComment">
    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=juliusomo" alt="you" class="avatar" id="currentUserAvatar">
    <textarea id="mainCommentInput" placeholder="Add a comment..."></textarea>
    <button class="btn-primary" id="sendMainBtn">SEND</button>
  </div>
</div>

<div id="deleteModal" class="modal-overlay">
  <div class="modal-card">
    <h3>Delete comment</h3>
    <p>Are you sure you want to delete this comment? This will remove the comment and can't be undone.</p>
    <div class="modal-actions">
      <button class="modal-cancel" id="cancelModalBtn">NO, CANCEL</button>
      <button class="modal-delete" id="confirmModalBtn">YES, DELETE</button>
    </div>
  </div>
</div>


</body>
</html>
